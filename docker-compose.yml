# Use root/example as user/password credentials
# written with the help of AI: defines and connects the services that run together —
# the web app, the MongoDB database, the database admin UI, and the 3D model viewer.
services:

  app:
    build: .
    restart: always
    ports:
      - 8000:8000
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB_ADMIN: root
      MONGO_DB_PASSWORD: example
      MONGO_DB_NAME: exercise_1
    depends_on:
      - mongo

  xeokit:
    build: ./xeokit-bim-viewer-master/
    restart: always
    ports:
      - 8080:8080

  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: exercise_1

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false
